map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Docker's embedded DNS. Combined with `set` below, this makes nginx
    # resolve upstream hostnames lazily per-request instead of once at
    # startup — required because voice-relay/openai-voice-relay are optional
    # (behind the "voice" compose profile) and may not be running; without
    # this, nginx refuses to start at all if any upstream host doesn't exist.
    resolver 127.0.0.11 valid=10s;

    location /ws/voice {
        set $upstream_voice voice-relay:8766;
        proxy_pass http://$upstream_voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /ws/openai-voice {
        set $upstream_openai openai-voice-relay:8767;
        proxy_pass http://$upstream_openai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
